
# Default values for ansible-ui
replicaCount: 1

image:
  repository: ansible-ui
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: true
  playbooks:
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  inventories:
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  roles:
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi

env:
  PORT: 3001
  NODE_ENV: production
  ANSIBLE_PLAYBOOKS_DIR: /etc/ansible/playbooks
  ANSIBLE_INVENTORIES_DIR: /etc/ansible/inventories
  ANSIBLE_ROLES_DIR: /etc/ansible/roles
  # Add log level for debugging
  LOG_LEVEL: info
  # Enable verbose mode for ansible playbooks
  ANSIBLE_VERBOSE: true
  # Allow becoming root when needed
  ANSIBLE_BECOME_ENABLED: true

# License configuration
license:
  # Set to true to require license validation
  enabled: false
  # Maximum number of allowed users
  maxUsers: 5
  # Features to enable
  features:
    - core
    - playbooks
    - inventories
    - roles
    - job-scheduler
    - cloud-inventory

# Optional custom domain configuration
customDomain:
  enabled: false
  name: "ansible-ui.example.com"
  tls:
    enabled: false
    secretName: "ansible-ui-tls"
    # Add certificate manager integration
    certManager:
      enabled: false
      issuer:
        kind: "ClusterIssuer"
        name: "letsencrypt-prod"

# Prometheus monitoring
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false

# Security configuration
security:
  # Configure host security context for pods
  podSecurityContext: {}
  # Configure container security context
  securityContext: {}
  # Network policies
  networkPolicies:
    enabled: false

# Backup configuration
backup:
  enabled: false
  schedule: "0 1 * * *"  # Default to 1 AM daily
  retention: 7  # Number of backups to retain

# Advanced playbook execution settings
playbookExecution:
  # Maximum concurrent playbook executions
  maxConcurrent: 5
  # Timeout in seconds for playbook execution (default 30 minutes)
  timeoutSeconds: 1800
  # Directory for temporary files
  tempDir: "/tmp/ansible-ui"
  # Keep logs for completed playbooks (in days, 0 = forever)
  logRetention: 30
  # Use real-time execution for playbooks (recommended)
  realTimeExecution: true
  # Set verbosity level for ansible playbook (0-4)
  verbosity: 1

# Configure external services integration
externalServices:
  # Git repositories integration
  git:
    enabled: false
    repositories: []
  # S3 compatible storage for logs
  s3Storage:
    enabled: false
    endpoint: ""
    bucket: ""
    accessKey: ""
    secretKey: ""
    region: "us-east-1"
