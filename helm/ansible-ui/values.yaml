
# Default values for ansible-ui
replicaCount: 1

image:
  repository: ansible-ui
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: true
  playbooks:
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  inventories:
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  roles:
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi

env:
  PORT: 3001
  NODE_ENV: production
  ANSIBLE_PLAYBOOKS_DIR: /etc/ansible/playbooks
  ANSIBLE_INVENTORIES_DIR: /etc/ansible/inventories
  ANSIBLE_ROLES_DIR: /etc/ansible/roles

# License configuration
license:
  # Set to true to require license validation
  enabled: false
  # Maximum number of allowed users
  maxUsers: 5
  # Features to enable
  features:
    - core
    - playbooks
    - inventories
    - roles
    - job-scheduler
    - cloud-inventory

# Optional custom domain configuration
customDomain:
  enabled: false
  name: "ansible-ui.example.com"
  tls:
    enabled: false
    secretName: "ansible-ui-tls"

# Prometheus monitoring
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
