
version: '3'
services:
  ansible-ui:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - ./lib:/app/lib
      - ./ansible.db:/app/ansible.db
      - ${ANSIBLE_PLAYBOOKS_DIR:-/etc/ansible/playbooks}:${ANSIBLE_PLAYBOOKS_DIR:-/etc/ansible/playbooks}:ro
      - ${ANSIBLE_INVENTORIES_DIR:-/etc/ansible/inventories}:${ANSIBLE_INVENTORIES_DIR:-/etc/ansible/inventories}:ro
      - ${ANSIBLE_ROLES_DIR:-/etc/ansible/roles}:${ANSIBLE_ROLES_DIR:-/etc/ansible/roles}:ro
    environment:
      - PORT=3001
      - NODE_ENV=production
      - ANSIBLE_PLAYBOOKS_DIR=${ANSIBLE_PLAYBOOKS_DIR:-/etc/ansible/playbooks}
      - ANSIBLE_INVENTORIES_DIR=${ANSIBLE_INVENTORIES_DIR:-/etc/ansible/inventories}
      - ANSIBLE_ROLES_DIR=${ANSIBLE_ROLES_DIR:-/etc/ansible/roles}
    restart: unless-stopped
