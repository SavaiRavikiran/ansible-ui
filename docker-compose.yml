
version: '3'
services:
  ansible-ui:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - ./lib:/app/lib
      - ./ansible.db:/app/ansible.db
      - ansible-playbooks:/etc/ansible/playbooks
      - ansible-inventories:/etc/ansible/inventories
      - ansible-roles:/etc/ansible/roles
    environment:
      - PORT=3001
      - NODE_ENV=production
      - ANSIBLE_PLAYBOOKS_DIR=/etc/ansible/playbooks
      - ANSIBLE_INVENTORIES_DIR=/etc/ansible/inventories
      - ANSIBLE_ROLES_DIR=/etc/ansible/roles
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  ansible-playbooks:
  ansible-inventories:
  ansible-roles:
