
version: '3.8'
services:
  ansible-ui:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - ./lib:/app/lib
      - ./ansible.db:/app/ansible.db
      - type: bind
        source: ${ANSIBLE_PLAYBOOKS_DIR:-./dev-ansible/playbooks}
        target: /etc/ansible/playbooks
      - type: bind
        source: ${ANSIBLE_INVENTORIES_DIR:-./dev-ansible/inventories}
        target: /etc/ansible/inventories
      - type: bind
        source: ${ANSIBLE_ROLES_DIR:-./dev-ansible/roles}
        target: /etc/ansible/roles
    environment:
      - PORT=3001
      - NODE_ENV=production
      - ANSIBLE_PLAYBOOKS_DIR=/etc/ansible/playbooks
      - ANSIBLE_INVENTORIES_DIR=/etc/ansible/inventories
      - ANSIBLE_ROLES_DIR=/etc/ansible/roles
      - ANSIBLE_VERBOSE=true
      - ANSIBLE_BECOME_ENABLED=true
      - ANSIBLE_BECOME_METHOD=sudo
      - LOG_LEVEL=debug
    restart: unless-stopped
    privileged: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
